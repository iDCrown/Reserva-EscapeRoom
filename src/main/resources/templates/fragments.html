<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=account_circle" /></header>
<body>
    <!-- Los fragments son componentes que usaremos para incluir en cada pagina y evitar escribir codigo repetitivo -->
    <!-- Header fragment-->
    <div class="bg-black text-white" th:fragment="header">
        <header class="d-flex justify-content-between align-items-center p-3">
            <h1>Escape Room</h1>
            <nav class="d-flex justify-content-end">
                <a href="#">
                    <span class="material-symbols-outlined text-white fs-2 me-3">
                    account_circle
                    </span>
                </a>
            </nav>
        </header>
    </div>

    <!-- Footer fragment -->
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
