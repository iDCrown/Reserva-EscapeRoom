<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Sala</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

    <button class="btn btn-primary" id="btnReserva">Reserva</button>
    
    <!-- Modal centrado -->
    <div class="modal fade" id="reservaModal" tabindex="-1" aria-labelledby="reservaModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <div class="modal-header">
                    <h5 class="modal-title" id="reservaModalLabel">Reserva tu sala</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <form th:action="@{/api/reservas/createReserva}" method="post" th:object="${reserva}">
                        <div class="mb-3">
                            <label for="fechaReserva" class="form-label">Fecha de Reserva:</label>
                            <input type="date" id="fechaReserva" th:field="*{fechaReserva}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="horaInicio" class="form-label">Hora de Reserva:</label>
                            <select id="horaInicio" th:field="*{horaInicio}" class="form-select" required>
                                <option value="" disabled selected>Seleccione una hora</option>
                                <option value="10:00">10:00 AM - 11:00 AM</option>
                                <option value="12:00">11:00 AM - 12:00 PM</option>
                                <option value="14:00">1:00 PM - 2:00 PM</option>
                                <option value="16:00">2:00 PM - 3:00 PM</option>
                                <option value="18:00">3:00 PM - 4:00 PM</option>
                                <option value="20:00">4:00 PM - 5:00 PM</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="numeroPersonas" class="form-label">Número de Personas:</label>
                            <input type="number" id="numeroPersonas" th:field="*{numeroPersonas}" class="form-control" min="4" required>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-success">Reservar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
 document.addEventListener("DOMContentLoaded", function () {
    const button = document.getElementById("btnReserva");
    const modal = document.getElementById("reservaModal");
    const isAuthenticated = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;

    button.addEventListener("click", function () {
        if (!isAuthenticated) {
            // Mostrar modal de Bootstrap
            const reservaModal = new bootstrap.Modal(modal);
            reservaModal.show();
        } else {
            // Redirigir a login
            alert("Debes iniciar sesión para reservar");
            window.location.href = "/login";
        }
    });
});
</script>
</html>
