<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <style>
        main section img{
            width: 100vw;
            height: 600px;
            object-fit: cover;
        }
        main section .content{
            color: white;
        }
    </style>
    <!-- fragmento header -->
    <div th:replace="fragments :: header"></div>

    <!-- salas -->
     <main>
        <section class="d-flex justify-content-center align-items-center w-100 position-relative ">
            <img src="https://rowkaescaperoom.com/wp-content/uploads/2022/07/tipos-escape-room.jpg" alt="">
            <div class="text-center position-absolute content w-50">
                <h1>Bienvenidos</h1>
                <h3>¿TERROR, MISTERIO O AVENTURA?</h3>
                <p>En Escape Room podrás elegir entre una gran variedad de salas de escape para vivir una experiencia única e inolvidable con tus amigos. ¿Te atreves a descubrirlas todas?</p>
            </div>
        </section>
     </main>

     <!-- Fragmento Footer -->
      <div th:replace="fragments :: footer"></div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
