<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
    <link rel="stylesheet" th:href="@{/css/site.css}">

<body>
    <style>
        .social-icons .material-symbols-outlined:hover {
        color: #d62828;
        cursor: pointer;
        }
    .escape-card {
        position: relative;
        width: 355px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
    }

    .escape-card .image-container {
        position: relative;
        width: 100%;
        height: 200px;
        overflow: hidden;
    }

    .escape-card .image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.85);
    }

    .escape-card .overlay-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%);
    }

    .escape-card .header-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .escape-card .title-area h3 {
        font-size: 1.5rem;
        font-weight: 900;
        line-height: 1;
        text-transform: uppercase;
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
        margin-bottom: 6px;
        color: white;
    }

    .escape-card .subtitle {
        font-size: 0.6rem;
        font-weight: 300;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
        line-height: 1.2;
        color: white;
    }

    .escape-card .reserve-btn {
        background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
        color: white;
        padding: 8px 18px;
        font-size: 0.9rem;
        font-weight: 900;
        text-transform: uppercase;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
        transition: all 0.3s ease;
        letter-spacing: 1px;
    }

    .escape-card .reserve-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(255, 107, 53, 0.6);
    }

    .escape-card .bottom-info {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .escape-card .info-left {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .escape-card .category {
        background: rgba(255, 255, 255, 0.95);
        color: #1a1a1a;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 0.65rem;
        font-weight: 600;
        width: fit-content;
    }

    .escape-card .age-info {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.7rem;
        font-weight: 600;
        color: white;
    }

    .escape-card .info-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
    }

    .escape-card .mode {
        background: rgba(0, 0, 0, 0.8);
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 0.6rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        color: white;
    }

    .escape-card .players-info {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.7rem;
        font-weight: 600;
        color: white;
    }

    .escape-card .icon {
        font-size: 0.85rem;
    }

    <!-- fragmento header -->
    <div th:replace="~{fragments/fragments :: header}"></div>

    <!-- salas -->
     <main>
        <div class="d-flex justify-content-center align-items-center w-100 position-relative ">
            <img style="width: 100%; height: 69vh; object-fit: cover;" src="https://rowkaescaperoom.com/wp-content/uploads/2022/07/tipos-escape-room.jpg" alt="">
            <div class="text-center position-absolute content w-50">
                <h1 class="text-white">BIENVENIDOS</h1>
                <h3 class="text-white">¿Terror, Misterio o Aventura?</h3>
                <p class="text-white">En Escape Room podrás elegir entre una gran variedad de salas de escape para vivir una experiencia única e inolvidable con tus amigos. ¿Te atreves a descubrirlas todas?</p>
            </div>
        </div>
        <div style="background-color: #2d2a31;" class=" p-5 ">
            <h1 class="text-center mb-5 text-white mt-5">Salas disponibles</h1>
            <div class="row" th:if="${#lists.isEmpty(amenity)}">
                <p class="text-center">No hay salas disponibles en este momento.</p>
            </div>
            <div class=" d-flex justify-content-center">
                <div style="width: 83em;" class="row  row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 d-flex justify-content-center" th:if="${!#lists.isEmpty(amenity)}">
                    <div class=" gap-5 row w-100 mb-5 row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 d-flex justify-content-center" th:if="${!#lists.isEmpty(amenity)}">
                        <div class="col" style=" width: 23em;" th:each="amenity : ${amenity}">
                            <div class="escape-card">
                                <div class="image-container">
                                    <img th:src="${amenity.imageUrl}" alt="Escape Room">
                                    <div class="overlay-content">
                                        <div class="header-section">
                                            <div class="title-area">
                                                <h3 th:text="${amenity.nombre}"></h3>
                                            </div>
                                            <a th:href="@{/amenities/view/{id}(id=${amenity.idAmenity})}">
                                                <button class="reserve-btn">RESERVAR</button>
                                            </a>
                                        </div>
    
                                        <div class="bottom-info">
                                            <div class="info-left">
                                                <div class="category" th:text="${amenity.categoria}"></div>
                                                <div class="age-info">
                                                    <span>Edad 10+</span>
                                                    <span class="icon">⏱</span>
                                                    <span>60</span>
                                                </div>
                                            </div>
    
                                            <div class="info-right">
                                                <div class="players-info">
                                                    <span class="icon">👥</span>
                                                    <span>3 - <span th:text="${amenity.capacidad}"></span></span>
                                                    
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div> 
                </div>
            </div>
        </div>
     </main>

     <!-- Fragmento Footer -->
      <div th:replace="~{fragments/fragments :: footer}"></div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

            alert('¡Redirigiendo a la página de reservas!');

        }

        // Efecto hover suave en la tarjeta
        const card = document.querySelector('.card');
        card.addEventListener('mouseenter', function() {
            this.style.transform = 'scale(1.02)';
            this.style.transition = 'transform 0.3s ease';
        });
        
        card.addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
        });
    </script>
</html>
