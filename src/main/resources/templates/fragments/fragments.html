<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Los fragments son componentes que usaremos para incluir en cada pagina y evitar escribir codigo repetitivo -->
    <!-- Header fragment-->
        <header class="header" th:fragment="header">
            <div class="header-content">
                <div class="logo-section">
                    <a th:href="@{/homePage}">
                        <div class="logo-icon">🔒</div>
                        <div class="logo-text">
                            <h1>Escape Room</h1>
                        </div>
                    </a>
                </div>
                <a id="btnLogin"
                    sec:authorize="!isAuthenticated()"
                    th:href="@{/auth/login}">
                    <button class="btn btn-danger btn-logout">Inicio sesión</button>
                </a>
                <form class="formButtons" action="/logout" method="post" sec:authorize="isAuthenticated()">
                    <span class="user-name">Bienvenido, <strong th:text="${userProfile}">Usuario</strong>
                    </span>
                    <a th:href="@{/miPerfil}">
                        <span class="btn btn-logout">Mi perfil</span>
                    </a>
                    <div class="user-menu">
                        <button type="submit" class="btn btn-danger  btn-logout">  <i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
                    </div>
                </form>
            </div>
        </header>

    <!-- Footer fragment -->

    <footer class="bg-black text-white" th:fragment="footer">
        <div class="container pt-5 px-4">
            <div class="row">
                <div class="col-6 col-lg-4">
                    <h2>EscapeRoom</h2>
                    <p>📍 Calle 45 #18-27, Bogotá, Colombia</p>
                    <p>📞 +57 302 828 3845</p>
                    <p>📞 +57 300 000 0001</p>
                </div>
                <div class="col"> 
                    <h2 class="pt-3 fw-bold">Horarios</h2> 
                    <p>Lunes a Viernes: 10:00 a.m. – 5:00 p.m.</p>
                    <p>Sábados, Domingos y Festivos: 10:00 a.m. – 4:00 p.m.</p>
                </div>
                <div class="col-6 col-lg-3 text-lg-end">
                    <h2 class="pt-3 fw-bold">Redes Sociales</h2>
                    <!-- Iconos redes sociales -->
                    <div class="social-icons" style="display: flex; gap: 10px; margin-top: 5px; justify-content: flex-end;">
                        <span class="material-symbols-outlined"> </span>
                        <span class="material-symbols-outlined">photo_camera</span>
                        <span class="material-symbols-outlined">smart_display</span>
                        <span class="material-symbols-outlined">alternate_email</span>
                    </div>
                </div>
            </div>
        </div>
    </footer>



</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
