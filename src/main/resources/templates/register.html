<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro Escape Room</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-8 col-lg-6">

        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title text-center mb-4">Crear cuenta</h3>

            <!-- El controlador debe cargar model.addAttribute("user", new UserDTO()) -->
            <form th:action="@{/users/register}" th:object="${user}" method="post">

              <!-- Global error (opcional) -->
              <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="nombre" class="form-label">Nombre</label>
                  <input type="text" th:field="*{nombre}" id="nombre" class="form-control" placeholder="Nombre" required minlength="2"/>
                  <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="col-md-6 mb-3">
                  <label for="apellido" class="form-label">Apellido</label>
                  <input type="text" th:field="*{apellido}" id="apellido" class="form-control" placeholder="Apellido" required minlength="2"/>
                  <div class="text-danger" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="tipoDocumento" class="form-label">Tipo de documento</label>
                  <input type="text" th:field="*{tipoDocumento}" id="tipoDocumento" class="form-control" placeholder="CC / CE / Pasaporte" required/>
                  <div class="text-danger" th:if="${#fields.hasErrors('tipoDocumento')}" th:errors="*{tipoDocumento}"></div>
                </div>

                <div class="col-md-6 mb-3">
                  <label for="numeroDocumento" class="form-label">Número de documento</label>
                  <input type="text" th:field="*{numeroDocumento}" id="numeroDocumento" class="form-control" placeholder="Número" required pattern="[0-9]{6,20}"/>
                  <div class="text-danger" th:if="${#fields.hasErrors('numeroDocumento')}" th:errors="*{numeroDocumento}"></div>
                </div>
              </div>

              <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" th:field="*{telefono}" id="telefono" class="form-control" placeholder="+573001234567" pattern="^\+?[0-9]{7,15}$"/>
                <div class="text-danger" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
              </div>

              <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" th:field="*{username}" id="username" class="form-control" placeholder="usuario" required minlength="3"/>
                <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input type="password" name="password" th:field="*{password}" id="password" class="form-control" placeholder="********" required minlength="6"/>
                  <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <!-- <div class="col-md-6 mb-3">
                  <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                  <input type="password" id="confirmPassword" class="form-control" placeholder="Repite la contraseña" required minlength="6"/>
                  <div id="pwMismatch" class="text-danger mt-1" style="display:none;">Las contraseñas no coinciden.</div>
                </div> -->
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Registrarme</button>
              </div>

            </form>

            <div class="mt-3 text-center">
              <small>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></small>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
